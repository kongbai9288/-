name: Auto Search Witch Hut (C++)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '种子号码'
        required: true
        default: '-1421144132636065691'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcubiomes-dev

      - name: Clone and build Finders
        run: |
          git clone https://github.com/hube12/Finders.git
          cd Finders
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: Run search
        run: |
          cd Finders/build
          # 运行 QuadWitchHutFinder，扫描范围 0-1000（可调），用你的种子
          ./QuadWitchHutFinder -s ${{ github.event.inputs.seed }} -r 0 1000 > ../../results.txt 2>&1

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
