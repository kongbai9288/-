name: Cubiomes Viewer Search

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '要搜索的种子 (例如: -1421144132636065691)'
        required: true
        default: '-1421144132636065691'
      version:
        description: 'Minecraft 版本 (例如: 1.21)'
        required: true
        default: '1.21'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Cubiomes Viewer
        run: |
          wget https://github.com/Cubitect/cubiomes-viewer/releases/download/4.1.2/cubiomes-viewer-4.1.2-x86_64.AppImage
          chmod +x cubiomes-viewer-4.1.2-x86_64.AppImage

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: 执行搜索
        run: |
          ./cubiomes-viewer-4.1.2-x86_64.AppImage --nogui \
            --seed ${{ github.event.inputs.seed }} \
            --version ${{ github.event.inputs.version }} \
            --list Swamp_Hut > results.txt 2>&1 || true

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
