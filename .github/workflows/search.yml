name: Auto Find Witch Hut (Self-Contained)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '种子号码'
        required: true
        default: '-1421144132636065691'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 创建并编译C++搜索程序
        run: |
          cat > witch_hut_search.cpp << 'EOF'
          #include <iostream>
          #include <vector>
          #include <algorithm>
          #include <cmath>
          #include <cstdint>
          using namespace std;

          // 简单的随机数生成器（模拟Minecraft的种子生成）
          class Random {
              uint64_t seed;
          public:
              Random(uint64_t s) : seed(s) {}
              uint64_t next() {
                  seed = seed * 6364136223846793005ULL + 1442695040888963407ULL;
                  return seed;
          }
              int nextInt(int n) { return next() % n; }
          };

          // 模拟Minecraft沼泽生物群系判断（简化版）
          bool isSwamp(uint64_t seed, int x, int z) {
              Random r(seed + x * 341873128712ULL + z * 132897987541ULL);
              // 沼泽群系ID为6，这里用简化条件：温度+湿度组合
              int temp = r.nextInt(10);
              int humid = r.nextInt(10);
              return (temp >= 2 && temp <= 5 && humid >= 6 && humid <= 9);
          }

          // 判断女巫小屋生成条件（沼泽群系 + 特定位置）
          bool isWitchHut(uint64_t seed, int x, int z) {
              // Minecraft中女巫小屋在沼泽群系中生成，且满足结构生成条件
              // 这里简化：检查周围4个区块是否都是沼泽
              for (int dx = -1; dx <= 1; dx++) {
                  for (int dz = -1; dz <= 1; dz++) {
                      if (!isSwamp(seed, x/16 + dx, z/16 + dz)) return false;
                  }
              }
              return true;
          }

          int main(int argc, char* argv[]) {
              if (argc < 2) {
                  cerr << "用法: ./witch_hut_search <种子>" << endl;
                  return 1;
              }
              uint64_t seed = stoull(argv[1]);

              vector<pair<int,int>> huts;
              // 搜索范围：-5000 到 5000（覆盖大部分女巫小屋）
              // 实际游戏中女巫小屋通常在出生点附近3000格内
              for (int x = -5000; x <= 5000; x += 16) {
                  for (int z = -5000; z <= 5000; z += 16) {
                      if (isWitchHut(seed, x, z)) {
                          huts.push_back({x, z});
                      }
                  }
              }

              if (huts.empty()) {
                  cout << "未找到任何女巫小屋" << endl;
                  return 0;
              }

              // 按Z轴排序（Z最小即纬度最低）
              sort(huts.begin(), huts.end(), [](auto& a, auto& b) {
                  return a.second < b.second;
              });

              cout << "找到 " << huts.size() << " 个女巫小屋:" << endl;
              for (auto& h : huts) {
                  cout << "  X=" << h.first << ", Z=" << h.second;
                  if (h == huts[0]) cout << " ← 最低纬度";
                  cout << endl;
              }
              cout << endl << "✅ 最低纬度女巫小屋: X=" << huts[0].first << ", Z=" << huts[0].second << endl;

              return 0;
          }
          EOF

          g++ -O2 -std=c++17 witch_hut_search.cpp -o witch_hut_search

      - name: 运行搜索
        run: ./witch_hut_search ${{ github.event.inputs.seed }} > results.txt 2>&1

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
