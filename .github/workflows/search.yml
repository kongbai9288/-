name: Final Auto Search

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '种子号码'
        required: true
        default: '-1421144132636065691'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Download Cubiomes library
        run: |
          wget https://github.com/Cubitect/cubiomes/releases/download/v1.6.0/libcubiomes.so
          wget https://raw.githubusercontent.com/Cubitect/cubiomes/master/cubiomes.h

      - name: Create and compile C program
        run: |
          cat > search.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include "cubiomes.h"

          int main(int argc, char *argv[]) {
              if (argc < 2) {
                  fprintf(stderr, "Usage: %s <seed>\n", argv[0]);
                  return 1;
              }
              long long seed = atoll(argv[1]);

              // 创建生成器
              Generator g;
              initGenerator(&g, MC_1_21, seed);

              // 搜索女巫小屋
              StructureConfig sc;
              getStructureConfig(Structure_SwampHut, &sc);

              // 遍历坐标（简化示例）
              printf("搜索种子 %lld 的女巫小屋...\n", seed);
              // 实际调用getStructurePositions需要更多参数
              // 这里只是展示框架

              return 0;
          }
          EOF

      # 这里无法编译，因为cubiomes.h需要更多依赖
