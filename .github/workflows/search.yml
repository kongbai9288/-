name: Find Lowest Witch Hut (Full Auto)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '种子号码'
        required: true
        default: '-1421144132636065691'
      radius:
        description: '搜索半径（方块，默认50000）'
        required: true
        default: '50000'

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出您的仓库
        uses: actions/checkout@v4

      - name: 克隆 Cubiomes 源码
        uses: actions/checkout@v4
        with:
          repository: Cubitect/cubiomes
          path: cubiomes
          retries: 3

      - name: 列出 Cubiomes 目录结构（调试）
        run: |
          ls -la cubiomes/
          find cubiomes -name "*.h" | head -20

      - name: 安装编译工具
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake

      - name: 编译 Cubiomes 库
        run: |
          cd cubiomes
          mkdir -p build && cd build
          cmake -DBUILD_SHARED_LIBS=ON ..
          make -j$(nproc)

      - name: 自动查找并编译（方案A：头文件在 include/）
        run: |
          if [ -f cubiomes/include/cubiomes.h ]; then
            echo "找到 include/cubiomes.h"
            gcc -I./cubiomes/include -L./cubiomes/build -lcubiomes -lm search.c -o search
          elif [ -f cubiomes/src/cubiomes.h ]; then
            echo "找到 src/cubiomes.h"
            gcc -I./cubiomes/src -L./cubiomes/build -lcubiomes -lm search.c -o search
          elif [ -f cubiomes/cubiomes.h ]; then
            echo "找到根目录 cubiomes.h"
            gcc -I./cubiomes -L./cubiomes/build -lcubiomes -lm search.c -o search
          else
            echo "未找到头文件，请检查目录结构"
            find cubiomes -name "*.h" | grep -i cubiomes
            exit 1
          fi

      - name: 运行搜索
        run: |
          LD_LIBRARY_PATH=./cubiomes/build ./search ${{ github.event.inputs.seed }} ${{ github.event.inputs.radius }} > results.txt
          cat results.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: witch-huts
          path: results.txt
