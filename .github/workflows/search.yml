name: Auto Search Witch Hut

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cubiomes
        run: |
          pip install --upgrade pip
          pip install cubiomes

      - name: Run search script
        run: python search.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
