name: Cubiomes Viewer Headless Search

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1

      - name: Make executable
        run: chmod +x cubiomes-viewer-static-linux

      - name: Run search
        run: |
          ./cubiomes-viewer-static-linux --nogui --conditions conditions.txt > results.txt 2>&1 || true
          touch results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
