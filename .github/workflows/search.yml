name: Auto Find Lowest Y Swamp Hut

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '要搜索的种子'
        required: true
        default: '-1421144132636065691'
      max_y:
        description: '最大Y坐标 (0, -10, -20, -30, -40)'
        required: true
        default: '-40'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 下载 LowYSwampHut
        run: |
          wget -O LowYSwampHut.jar https://github.com/M33Galaxy/LowYSwampHut/releases/latest/download/LowYSwampHut.jar

      - name: 创建种子配置文件
        run: |
          echo "${{ github.event.inputs.seed }}" > seed.txt

      - name: 运行搜索
        run: |
          java -Xms2048m -Xmx4096m -jar LowYSwampHut.jar --headless --seed ${{ github.event.inputs.seed }} --max-y ${{ github.event.inputs.max_y }} --output result.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: swamp-hut-result
          path: result.txt
