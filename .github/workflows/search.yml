name: Auto Find Witch Hut

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '世界种子（整数）'
        required: true
        default: '-1421144132636065691'
      radius:
        description: '搜索半径（方块，默认10000）'
        required: false
        default: '10000'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行搜索脚本
        run: |
          python find_witch_huts.py ${{ github.event.inputs.seed }} ${{ github.event.inputs.radius }} > results.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.txt
